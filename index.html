<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardápio - Mariana Jacques Doces</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
        }
        .pdf-container {
            width: 100%;
            height: calc(100vh - 70px); /* Ajuste para o header */
            overflow: auto;
        }
        .mobile-alert {
            display: none;
            text-align: center;
            padding: 15px;
            background: #fff8e1;
            border-bottom: 1px solid #ffecb3;
        }
        @media (max-width: 768px) {
            .mobile-alert {
                display: block;
            }
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-alert">
        Para melhor visualização no celular: 
        <a href="cardapio.pdf" download style="color: #e91e63; font-weight: bold;">Clique para baixar</a> 
        ou use dois dedos para zoom.
    </div>
    
    <div class="pdf-container">
        <embed 
            src="cardapio.pdf#view=FitH&scrollbar=1&toolbar=0" 
            type="application/pdf" 
            width="100%" 
            height="100%"
            style="border: none;"
        >
    </div>

    <script>
        // Detectar mobile e adicionar classe para ajustes
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.body.classList.add('is-mobile');
        }
    </script>
</body>
</html>
