<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Mariana Jacques Doces</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff9f9;
        }
        .header {
            background-color: #ffffff;
            padding: 15px 0;
            box-shadow: 0 2px 10px rgba(233, 30, 99, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 {
            color: #e91e63;
            text-align: center;
            margin: 0;
            font-size: 1.5rem;
        }
        .viewer-container {
            width: 100%;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
        }
        .pdf-toolbar {
            padding: 10px;
            background: #f8f8f8;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .pdf-viewer {
            flex-grow: 1;
            border: none;
            overflow: hidden;
        }
        .mobile-warning {
            display: none;
            text-align: center;
            padding: 15px;
            background: #fff3f3;
            border-top: 1px solid #ffd6d6;
        }
        @media (max-width: 768px) {
            .mobile-warning {
                display: block;
            }
            .pdf-toolbar {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Cardápio - Mariana Jacques Doces</h1>
    </div>

    <div class="viewer-container">
        <!-- Solução principal usando PDF.js -->
        <div id="pdf-viewer" class="pdf-viewer"></div>
        
        <div class="mobile-warning">
            Dica: Use o botão "Download" abaixo para visualizar todas as páginas com mais facilidade.
        </div>
        
        <div class="pdf-toolbar">
            <button onclick="downloadPDF()">Download</button>
            <button onclick="printPDF()">Imprimir</button>
        </div>
    </div>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
    <script>
        // Configuração do PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js';
        
        // Carrega o PDF
        function loadPDF() {
            const container = document.getElementById('pdf-viewer');
            container.innerHTML = ''; // Limpa o container
            
            pdfjsLib.getDocument('cardapio.pdf').promise.then(function(pdf) {
                // Carrega todas as páginas
                for (let i = 1; i <= pdf.numPages; i++) {
                    pdf.getPage(i).then(function(page) {
                        const viewport = page.getViewport({ scale: 1.0 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        
                        container.appendChild(canvas);
                        
                        page.render({
                            canvasContext: context,
                            viewport: viewport
                        });
                        
                        // Adiciona espaço entre páginas
                        if (i < pdf.numPages) {
                            container.appendChild(document.createElement('hr'));
                        }
                    });
                }
            }).catch(function(error) {
                // Fallback se PDF.js falhar
                container.innerHTML = `
                    <iframe 
                        src="cardapio.pdf#view=FitH&scrollbar=1" 
                        width="100%" 
                        height="100%"
                        style="border: none;">
                    </iframe>
                `;
            });
        }
        
        // Funções auxiliares
        function downloadPDF() {
            window.open('cardapio.pdf', '_blank');
        }
        
        function printPDF() {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = 'cardapio.pdf';
            document.body.appendChild(iframe);
            iframe.onload = function() {
                setTimeout(function() {
                    iframe.contentWindow.print();
                    document.body.removeChild(iframe);
                }, 500);
            };
        }
        
        // Inicializa quando a página carrega
        window.onload = loadPDF;
    </script>
</body>
</html>
