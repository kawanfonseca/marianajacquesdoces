<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cardápio Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            /* max-width: 800px; */
            margin: 0 auto;
            background: white;
            /* padding: 20px; */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .pdf-container {
            width: 100%;
            height: 100vh;
            margin-top: 20px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pdf-container">
            <iframe 
                src="cardapio.pdf" 
                width="100%" 
                height="100%" 
                style="border: none;">
                Seu navegador não suporta PDFs. 
                <a href="cardapio.pdf">Baixe o cardápio aqui</a>.
            </iframe>
        </div>
    </div>
</body>
</html>
